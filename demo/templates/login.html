<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Robocall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="logo-icon">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
      </div>
      <span class="text-xl font-bold text-stone-900 tracking-tight">Robocall</span>
    </div>

    <!-- Card -->
    <div class="card">

      <div class="mb-7">
        <h1 class="text-2xl font-bold text-stone-900">Welcome back</h1>
        <p class="text-sm text-stone-400 mt-1">Sign in to your store dashboard.</p>
      </div>

      {% if error %}
      <div class="alert-error mb-6">
        <svg class="w-4 h-4 text-red-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-sm text-red-700">{{ error }}</p>
      </div>
      {% endif %}

      <form method="POST" action="/login" class="space-y-5">

        <div>
          <label class="input-label">Email Address</label>
          <input type="email" name="email" placeholder="you@store.com" required autofocus class="input-field" />
        </div>

        <div>
          <label class="input-label">Password</label>
          <input type="password" name="password" placeholder="••••••••" required class="input-field" />
        </div>

        <button type="submit" class="btn-primary mt-2">Sign In →</button>

      </form>

    </div>

    <p class="text-center text-xs text-stone-400 mt-6">© <script>document.write(new Date().getFullYear())</script> Robocall. All rights reserved.</p>

  </div>

</body>
</html>
