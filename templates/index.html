<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Place Order — Robocall</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.4/build/css/intlTelInput.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-2.5 mb-8">
      <div class="logo-icon">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
      </div>
      <span class="font-bold text-xl text-gray-900 tracking-tight">Robocall</span>
    </div>

    <!-- Card -->
    <div class="card">

      <div class="mb-7">
        <h1 class="text-2xl font-bold text-gray-900">Place Your Order</h1>
        <p class="text-sm text-gray-500 mt-1">Fill in your details and we'll call you to confirm.</p>
      </div>

      <!-- Success -->
      <div id="success-msg" class="alert-success mb-6 hidden">
        <svg class="w-4 h-4 text-green-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div>
          <p class="text-sm font-medium text-green-800">Order placed successfully!</p>
          <p class="text-sm text-green-600 mt-0.5">Expect a confirmation call shortly.</p>
        </div>
      </div>

      <!-- Error -->
      <div id="error-msg" class="alert-error mb-6 hidden">
        <svg class="w-4 h-4 text-red-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p id="error-text" class="text-sm text-red-700">Something went wrong. Please try again.</p>
      </div>

      <form id="order-form" class="space-y-5">

        <div>
          <label class="input-label">Customer Name</label>
          <input type="text" id="customer_name" name="customer_name"
            placeholder="e.g. Muhammad Ali" required class="input-field" />
        </div>

        <div>
          <label class="input-label">Phone Number</label>
          <input type="tel" id="phone" name="phone" required class="input-field" />
        </div>

        <div>
          <label class="input-label">Store</label>
          <select id="store_id" name="store_id" required class="input-field">
            <option value="" disabled selected>Select a store</option>
            {% for store in stores %}
            <option value="{{ store.id }}">{{ store.business_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="input-label">Order Amount</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-sm font-semibold text-gray-400 select-none">PKR</span>
            <input type="number" id="order_amount" name="order_amount"
              placeholder="0" min="1" required class="input-field-prefix" />
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">Place Order</button>

      </form>

      <p class="mt-5 text-center text-xs text-gray-400">
        <a href="/dashboard" class="hover:text-indigo-600 transition-colors font-medium">← Back to dashboard</a>
      </p>

    </div>

  </div>

  <script>
    const form = document.getElementById('order-form');
    const submitBtn = document.getElementById('submit-btn');
    const successMsg = document.getElementById('success-msg');
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Placing order...';
      successMsg.classList.add('hidden');
      errorMsg.classList.add('hidden');

      const payload = {
        customer_name: form.customer_name.value.trim(),
        phone: iti.getNumber(),
        store_id: parseInt(form.store_id.value),
        order_amount: parseFloat(form.order_amount.value),
      };

      try {
        const res = await fetch('/place-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          successMsg.classList.remove('hidden');
          form.reset();
        } else {
          const data = await res.json();
          errorText.textContent = data.detail || 'Something went wrong. Please try again.';
          errorMsg.classList.remove('hidden');
        }
      } catch {
        errorText.textContent = 'Something went wrong. Please try again.';
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Place Order';
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.4/build/js/intlTelInput.min.js"></script>
  <script>
    const phoneInput = document.querySelector("#phone");
    const iti = window.intlTelInput(phoneInput, {
      initialCountry: "pk",
      countryOrder: ["pk", "ae", "gb", "us"],
      separateDialCode: true,
      loadUtils: () => import("https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.4/build/js/utils.js"),
    });
  </script>

</body>
</html>
