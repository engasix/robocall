<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Place Order — Robocall</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.4/build/css/intlTelInput.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body { font-family: 'Inter', sans-serif; }

    .gradient-bg {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 40%, #ec4899 100%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
    }

    .input-field {
      display: block;
      width: 100%;
      border-radius: 0.75rem;
      border: 1.5px solid #e5e7eb;
      background: #f9fafb;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: #111827;
      transition: all 0.15s ease;
      outline: none;
    }
    .input-field:focus {
      border-color: #8b5cf6;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }
    .input-field::placeholder { color: #9ca3af; }

    .blob1 {
      position: absolute; width: 400px; height: 400px;
      background: rgba(255,255,255,0.12); border-radius: 50%;
      top: -100px; right: -100px; filter: blur(60px);
    }
    .blob2 {
      position: absolute; width: 300px; height: 300px;
      background: rgba(236,72,153,0.2); border-radius: 50%;
      bottom: -80px; left: -80px; filter: blur(50px);
    }
  </style>
</head>

<body class="min-h-screen gradient-bg flex items-center justify-center p-4 relative overflow-hidden">

  <div class="blob1"></div>
  <div class="blob2"></div>

  <div class="relative z-10 w-full max-w-md">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-2.5 mb-8">
      <div class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
      </div>
      <span class="text-white font-bold text-xl tracking-tight">Robocall</span>
    </div>

    <!-- Card -->
    <div class="glass-card rounded-3xl shadow-2xl p-8">

      <div class="mb-7">
        <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Place Your Order</h1>
        <p class="text-sm text-gray-400 mt-1">We'll call you right away to confirm.</p>
      </div>

      <!-- Success -->
      <div id="success-msg" class="hidden mb-6 rounded-2xl bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200 px-4 py-4 flex items-start gap-3">
        <div class="w-8 h-8 rounded-xl bg-emerald-500 flex items-center justify-center shrink-0">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-emerald-800">Order placed!</p>
          <p class="text-sm text-emerald-600 mt-0.5">Expect a confirmation call shortly.</p>
        </div>
      </div>

      <!-- Error -->
      <div id="error-msg" class="hidden mb-6 rounded-2xl bg-red-50 border border-red-200 px-4 py-4 flex items-start gap-3">
        <div class="w-8 h-8 rounded-xl bg-red-500 flex items-center justify-center shrink-0">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </div>
        <p id="error-text" class="text-sm text-red-700 mt-1">Something went wrong. Please try again.</p>
      </div>

      <form id="order-form" class="space-y-4">

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Customer Name</label>
          <input type="text" id="customer_name" name="customer_name"
            placeholder="e.g. Muhammad Ali" required class="input-field" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Phone Number</label>
          <input type="tel" id="phone" name="phone" required class="input-field" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Store</label>
          <select id="store_id" name="store_id" required class="input-field">
            <option value="" disabled selected>Select a store</option>
            {% for store in stores %}
            <option value="{{ store.id }}">{{ store.business_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Order Amount</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-sm font-bold text-gray-400 select-none">PKR</span>
            <input type="number" id="order_amount" name="order_amount"
              placeholder="0" min="1" required
              class="input-field pl-14" />
          </div>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full mt-2 rounded-2xl px-4 py-3.5 text-sm font-bold text-white shadow-lg transition-all duration-200 disabled:opacity-60 disabled:cursor-not-allowed"
          style="background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899); box-shadow: 0 8px 24px rgba(139,92,246,0.35);">
          Place Order →
        </button>

      </form>

      <p class="mt-5 text-center text-xs text-gray-400">
        <a href="/dashboard" class="hover:text-violet-600 transition-colors font-medium">View order dashboard →</a>
      </p>

    </div>

    <p class="text-center text-white/40 text-xs mt-6">© 2025 Robocall. All rights reserved.</p>

  </div>

  <script>
    const form = document.getElementById('order-form');
    const submitBtn = document.getElementById('submit-btn');
    const successMsg = document.getElementById('success-msg');
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Placing order...';
      successMsg.classList.add('hidden');
      errorMsg.classList.add('hidden');

      const payload = {
        customer_name: form.customer_name.value.trim(),
        phone: iti.getNumber(),
        store_id: parseInt(form.store_id.value),
        order_amount: parseFloat(form.order_amount.value),
      };

      try {
        const res = await fetch('/place-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          successMsg.classList.remove('hidden');
          form.reset();
        } else {
          const data = await res.json();
          errorText.textContent = data.detail || 'Something went wrong. Please try again.';
          errorMsg.classList.remove('hidden');
        }
      } catch {
        errorText.textContent = 'Something went wrong. Please try again.';
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Place Order →';
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.4/build/js/intlTelInput.min.js"></script>
  <script>
    const phoneInput = document.querySelector("#phone");
    const iti = window.intlTelInput(phoneInput, {
      initialCountry: "pk",
      countryOrder: ["pk", "ae", "gb", "us"],
      separateDialCode: true,
      loadUtils: () => import("https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.4/build/js/utils.js"),
    });
  </script>

</body>
</html>
