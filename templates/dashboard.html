<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Robocall</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body class="min-h-screen bg-gray-50" style="font-family: 'Inter', sans-serif;">

  <!-- Navbar -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
        </div>
        <span class="font-semibold text-gray-900">Robocall</span>
        <span class="text-gray-300 mx-1">|</span>
        <span class="text-sm text-gray-500">Order Dashboard</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1.5 text-xs text-gray-400" id="live-indicator">
          <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse inline-block"></span>
          Live
        </div>
        <a href="/"
          class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700 transition-colors">
          + New Order
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Stats row -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">

      <div class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Total</p>
          <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center">
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
          </div>
        </div>
        <p id="stat-total" class="text-3xl font-bold text-gray-900">—</p>
        <p class="text-xs text-gray-400 mt-1">orders placed</p>
      </div>

      <div class="bg-white rounded-2xl border border-amber-100 p-5 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs font-semibold text-amber-500 uppercase tracking-widest">Pending</p>
          <div class="w-8 h-8 rounded-lg bg-amber-50 flex items-center justify-center">
            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        </div>
        <p id="stat-pending" class="text-3xl font-bold text-amber-500">—</p>
        <p class="text-xs text-amber-400 mt-1">awaiting response</p>
      </div>

      <div class="bg-white rounded-2xl border border-green-100 p-5 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs font-semibold text-green-600 uppercase tracking-widest">Confirmed</p>
          <div class="w-8 h-8 rounded-lg bg-green-50 flex items-center justify-center">
            <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        </div>
        <p id="stat-confirmed" class="text-3xl font-bold text-green-600">—</p>
        <p class="text-xs text-green-400 mt-1">orders confirmed</p>
      </div>

      <div class="bg-white rounded-2xl border border-red-100 p-5 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs font-semibold text-red-500 uppercase tracking-widest">Cancelled</p>
          <div class="w-8 h-8 rounded-lg bg-red-50 flex items-center justify-center">
            <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        </div>
        <p id="stat-cancelled" class="text-3xl font-bold text-red-500">—</p>
        <p class="text-xs text-red-300 mt-1">orders cancelled</p>
      </div>

    </div>

    <!-- Table card -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
        <h2 class="text-sm font-semibold text-gray-900">Recent Orders</h2>
        <p class="text-xs text-gray-400" id="last-updated"></p>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-100">
              <th class="text-left px-6 py-3.5 text-xs font-semibold text-gray-400 uppercase tracking-wide">Order</th>
              <th class="text-left px-6 py-3.5 text-xs font-semibold text-gray-400 uppercase tracking-wide">Customer</th>
              <th class="text-left px-6 py-3.5 text-xs font-semibold text-gray-400 uppercase tracking-wide">Phone</th>
              <th class="text-left px-6 py-3.5 text-xs font-semibold text-gray-400 uppercase tracking-wide">Store</th>
              <th class="text-left px-6 py-3.5 text-xs font-semibold text-gray-400 uppercase tracking-wide">Amount</th>
              <th class="text-left px-6 py-3.5 text-xs font-semibold text-gray-400 uppercase tracking-wide">Status</th>
              <th class="text-left px-6 py-3.5 text-xs font-semibold text-gray-400 uppercase tracking-wide">Time</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr>
              <td colspan="7" class="px-6 py-16 text-center">
                <div class="flex flex-col items-center gap-2 text-gray-400">
                  <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                  </svg>
                  <span class="text-sm">Loading orders...</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const STATUS_CONFIG = {
      pending:     { cls: 'bg-amber-50 text-amber-600 ring-1 ring-amber-200',   dot: 'bg-amber-400',  label: 'Pending' },
      confirmed:   { cls: 'bg-green-50 text-green-700 ring-1 ring-green-200',   dot: 'bg-green-500',  label: 'Confirmed' },
      cancelled:   { cls: 'bg-red-50 text-red-600 ring-1 ring-red-200',         dot: 'bg-red-400',    label: 'Cancelled' },
      no_response: { cls: 'bg-gray-100 text-gray-500 ring-1 ring-gray-200',     dot: 'bg-gray-400',   label: 'No Response' },
    };

    function statusBadge(status) {
      const cfg = STATUS_CONFIG[status] || STATUS_CONFIG.no_response;
      return `
        <span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-medium ${cfg.cls}">
          <span class="w-1.5 h-1.5 rounded-full ${cfg.dot}"></span>
          ${cfg.label}
        </span>`;
    }

    function formatTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('en-PK', { hour12: true, month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function emptyState(message) {
      return `
        <tr>
          <td colspan="7" class="px-6 py-16 text-center">
            <div class="flex flex-col items-center gap-2 text-gray-400">
              <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
              </svg>
              <span class="text-sm">${message}</span>
            </div>
          </td>
        </tr>`;
    }

    async function fetchOrders() {
      try {
        const res = await fetch('/api/orders');
        if (!res.ok) return;
        const orders = await res.json();

        const tbody = document.getElementById('orders-tbody');

        if (orders.length === 0) {
          tbody.innerHTML = emptyState('No orders yet. Place one to get started.');
        } else {
          tbody.innerHTML = orders.map(o => `
            <tr class="border-t border-gray-50 hover:bg-gray-50/60 transition-colors">
              <td class="px-6 py-4 text-xs font-mono text-gray-400">#${String(o.id).padStart(4, '0')}</td>
              <td class="px-6 py-4 font-medium text-gray-900">${o.customer_name}</td>
              <td class="px-6 py-4 text-gray-500 tabular-nums">${o.phone}</td>
              <td class="px-6 py-4">
                <span class="inline-flex items-center rounded-md bg-indigo-50 px-2 py-0.5 text-xs font-medium text-indigo-600 ring-1 ring-indigo-100">${o.store_name}</span>
              </td>
              <td class="px-6 py-4 font-semibold text-gray-900 tabular-nums">PKR ${Number(o.order_amount).toLocaleString()}</td>
              <td class="px-6 py-4">${statusBadge(o.status)}</td>
              <td class="px-6 py-4 text-gray-400 text-xs tabular-nums">${formatTime(o.created_at)}</td>
            </tr>
          `).join('');
        }

        document.getElementById('stat-total').textContent = orders.length;
        document.getElementById('stat-pending').textContent = orders.filter(o => o.status === 'pending').length;
        document.getElementById('stat-confirmed').textContent = orders.filter(o => o.status === 'confirmed').length;
        document.getElementById('stat-cancelled').textContent = orders.filter(o => o.status === 'cancelled').length;

        document.getElementById('last-updated').textContent =
          'Updated ' + new Date().toLocaleTimeString('en-PK', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });

      } catch (err) {
        console.error('Failed to fetch orders:', err);
      }
    }

    fetchOrders();
    setInterval(fetchOrders, 5000);
  </script>

</body>

</html>
