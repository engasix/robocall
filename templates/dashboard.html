<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Robocall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body class="min-h-screen">

  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-inner">
      <div class="flex items-center gap-3">
        <div class="logo-icon">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
        </div>
        <span class="font-bold text-stone-800 tracking-tight">Robocall</span>
        <span class="text-stone-300 mx-1">|</span>
        <span class="text-sm text-stone-400">Order Dashboard</span>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1.5 text-xs text-stone-400">
          <span class="live-dot"></span>
          Live
        </div>
        <div class="store-chip hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl text-sm text-stone-600">
          <svg class="w-3.5 h-3.5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
          <span class="font-medium">{{ store.business_name }}</span>
        </div>
        <a href="/place-order" class="btn-nav-primary">+ New Order</a>
        <a href="/logout" class="btn-ghost" title="Sign out">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Stats row -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">

      <div class="stat-card">
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs font-semibold uppercase tracking-widest text-stone-400">Total</p>
          <div class="stat-icon stat-icon-cream">
            <svg class="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
          </div>
        </div>
        <p id="stat-total" class="text-3xl font-bold text-stone-800">—</p>
        <p class="text-xs text-stone-400 mt-1">orders placed</p>
      </div>

      <div class="stat-card">
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs font-semibold uppercase tracking-widest text-amber-700">Pending</p>
          <div class="stat-icon stat-icon-amber">
            <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        </div>
        <p id="stat-pending" class="text-3xl font-bold text-amber-700">—</p>
        <p class="text-xs text-stone-400 mt-1">awaiting response</p>
      </div>

      <div class="stat-card">
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs font-semibold uppercase tracking-widest text-green-700">Confirmed</p>
          <div class="stat-icon stat-icon-success">
            <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        </div>
        <p id="stat-confirmed" class="text-3xl font-bold text-green-700">—</p>
        <p class="text-xs text-stone-400 mt-1">orders confirmed</p>
      </div>

      <div class="stat-card">
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs font-semibold uppercase tracking-widest text-red-600">Cancelled</p>
          <div class="stat-icon stat-icon-danger">
            <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        </div>
        <p id="stat-cancelled" class="text-3xl font-bold text-red-600">—</p>
        <p class="text-xs text-stone-400 mt-1">orders cancelled</p>
      </div>

    </div>

    <!-- Table card -->
    <div class="table-card">
      <div class="table-title-bar">
        <h2 class="text-sm font-semibold text-stone-800">Recent Orders</h2>
        <p class="text-xs text-stone-400" id="last-updated"></p>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="table-head-row">
              <th class="table-header">Order</th>
              <th class="table-header">Customer</th>
              <th class="table-header">Phone</th>
              <th class="table-header">Store</th>
              <th class="table-header">Amount</th>
              <th class="table-header">Status</th>
              <th class="table-header">Time</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr>
              <td colspan="7" class="px-6 py-16 text-center">
                <div class="flex flex-col items-center gap-2 text-stone-400">
                  <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                  </svg>
                  <span class="text-sm">Loading orders...</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const STATUS_DOT = {
      pending: 'dot-pending', confirmed: 'dot-confirmed',
      cancelled: 'dot-cancelled', no_response: 'dot-no-response',
    };
    const STATUS_BADGE = {
      pending: 'badge-pending', confirmed: 'badge-confirmed',
      cancelled: 'badge-cancelled', no_response: 'badge-no-response',
    };
    const STATUS_LABEL = {
      pending: 'Pending', confirmed: 'Confirmed',
      cancelled: 'Cancelled', no_response: 'No Response',
    };

    function statusBadge(status) {
      const cls = STATUS_BADGE[status] || 'badge-no-response';
      const dot = STATUS_DOT[status] || 'dot-no-response';
      const label = STATUS_LABEL[status] || status;
      return `<span class="${cls}"><span class="w-1.5 h-1.5 rounded-full inline-block ${dot}"></span>${label}</span>`;
    }

    function formatTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('en-PK', { hour12: true, month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function emptyState(msg) {
      return `<tr><td colspan="7" class="px-6 py-16 text-center">
        <div class="flex flex-col items-center gap-2 text-stone-400">
          <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          <span class="text-sm">${msg}</span>
        </div>
      </td></tr>`;
    }

    async function fetchOrders() {
      try {
        const res = await fetch('/api/orders');
        if (!res.ok) return;
        const orders = await res.json();
        const tbody = document.getElementById('orders-tbody');

        tbody.innerHTML = orders.length === 0
          ? emptyState('No orders yet. Place one to get started.')
          : orders.map(o => `
            <tr class="table-data-row transition-colors">
              <td class="table-cell text-xs font-mono text-stone-400">#${String(o.id).padStart(4, '0')}</td>
              <td class="table-cell font-medium text-stone-800">${o.customer_name}</td>
              <td class="table-cell text-stone-500 tabular-nums">${o.phone}</td>
              <td class="table-cell"><span class="badge-store">${o.store_name}</span></td>
              <td class="table-cell font-semibold text-stone-800 tabular-nums">PKR ${Number(o.order_amount).toLocaleString()}</td>
              <td class="table-cell">${statusBadge(o.status)}</td>
              <td class="table-cell text-stone-400 text-xs tabular-nums">${formatTime(o.created_at)}</td>
            </tr>`).join('');

        document.getElementById('stat-total').textContent = orders.length;
        document.getElementById('stat-pending').textContent = orders.filter(o => o.status === 'pending').length;
        document.getElementById('stat-confirmed').textContent = orders.filter(o => o.status === 'confirmed').length;
        document.getElementById('stat-cancelled').textContent = orders.filter(o => o.status === 'cancelled').length;
        document.getElementById('last-updated').textContent =
          'Updated ' + new Date().toLocaleTimeString('en-PK', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });

      } catch (err) {
        console.error('Failed to fetch orders:', err);
      }
    }

    fetchOrders();
    setInterval(fetchOrders, 5000);
  </script>

</body>
</html>
