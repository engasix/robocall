<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 p-6">

  <div class="max-w-6xl mx-auto">

    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Order Dashboard</h1>
        <p class="text-sm text-gray-500 mt-0.5">Live order status — updates every 5 seconds</p>
      </div>
      <a href="/" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700 transition-colors">
        + New Order
      </a>
    </div>

    <!-- Stats row -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide">Total</p>
        <p id="stat-total" class="text-2xl font-bold text-gray-900 mt-1">—</p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-xs font-medium text-yellow-600 uppercase tracking-wide">Pending</p>
        <p id="stat-pending" class="text-2xl font-bold text-yellow-600 mt-1">—</p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-xs font-medium text-green-600 uppercase tracking-wide">Confirmed</p>
        <p id="stat-confirmed" class="text-2xl font-bold text-green-600 mt-1">—</p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-xs font-medium text-red-500 uppercase tracking-wide">Cancelled</p>
        <p id="stat-cancelled" class="text-2xl font-bold text-red-500 mt-1">—</p>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th class="text-left px-4 py-3 font-medium text-gray-500">Order ID</th>
            <th class="text-left px-4 py-3 font-medium text-gray-500">Customer</th>
            <th class="text-left px-4 py-3 font-medium text-gray-500">Phone</th>
            <th class="text-left px-4 py-3 font-medium text-gray-500">Store</th>
            <th class="text-left px-4 py-3 font-medium text-gray-500">Amount (PKR)</th>
            <th class="text-left px-4 py-3 font-medium text-gray-500">Status</th>
            <th class="text-left px-4 py-3 font-medium text-gray-500">Time</th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
          <tr>
            <td colspan="7" class="px-4 py-10 text-center text-gray-400">Loading orders...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="text-xs text-gray-400 mt-4 text-right" id="last-updated"></p>

  </div>

  <script>
    const STATUS_STYLES = {
      pending:     'bg-yellow-100 text-yellow-700',
      confirmed:   'bg-green-100 text-green-700',
      cancelled:   'bg-red-100 text-red-600',
      no_response: 'bg-gray-100 text-gray-500',
    };

    function statusBadge(status) {
      const cls = STATUS_STYLES[status] || 'bg-gray-100 text-gray-500';
      const label = status.replace('_', ' ');
      return `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium capitalize ${cls}">${label}</span>`;
    }

    function formatTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('en-PK', { hour12: true });
    }

    async function fetchOrders() {
      try {
        const res = await fetch('/api/orders');
        if (!res.ok) return;
        const orders = await res.json();

        const tbody = document.getElementById('orders-tbody');

        if (orders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-10 text-center text-gray-400">No orders yet.</td></tr>`;
        } else {
          tbody.innerHTML = orders.map(o => `
            <tr class="border-t border-gray-100 hover:bg-gray-50 transition-colors">
              <td class="px-4 py-3 text-gray-500">#${o.id}</td>
              <td class="px-4 py-3 font-medium text-gray-900">${o.customer_name}</td>
              <td class="px-4 py-3 text-gray-500">${o.phone}</td>
              <td class="px-4 py-3 text-gray-500">${o.store_name}</td>
              <td class="px-4 py-3 text-gray-900">PKR ${Number(o.order_amount).toLocaleString()}</td>
              <td class="px-4 py-3">${statusBadge(o.status)}</td>
              <td class="px-4 py-3 text-gray-400 text-xs">${formatTime(o.created_at)}</td>
            </tr>
          `).join('');
        }

        // Update stats
        document.getElementById('stat-total').textContent = orders.length;
        document.getElementById('stat-pending').textContent = orders.filter(o => o.status === 'pending').length;
        document.getElementById('stat-confirmed').textContent = orders.filter(o => o.status === 'confirmed').length;
        document.getElementById('stat-cancelled').textContent = orders.filter(o => o.status === 'cancelled').length;

        document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString('en-PK', { hour12: true });

      } catch (err) {
        console.error('Failed to fetch orders:', err);
      }
    }

    fetchOrders();
    setInterval(fetchOrders, 5000);
  </script>

</body>
</html>
